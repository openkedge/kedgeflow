server {
    trust_domain = "pilot.kedgeflow.test"
    bind_address = "127.0.0.1"
    bind_port = 8081
    socket_path = "/run/kf-spire/private/server.sock"
    data_dir = "/var/lib/spire/server"
    log_level = "WARN"
    log_file = "/var/log/kf-spire-server.log"
    jwt_key_type = "ec-p256"
    default_jwt_svid_ttl = "5m"
    default_x509_svid_ttl = "10m"
    ca_subject { common_name = "KedgeFlow disposable SPIRE pilot" }
}
plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/var/lib/spire/server/datastore.sqlite3"
        }
    }
    NodeAttestor "join_token" { plugin_data {} }
    KeyManager "disk" { plugin_data { keys_path = "/var/lib/spire/server/keys.json" } }
}

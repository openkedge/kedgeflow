agent {
    trust_domain = "pilot.kedgeflow.test"
    server_address = "127.0.0.1"
    server_port = 8081
    socket_path = "/run/kf-spire/agent.sock"
    trust_bundle_path = "/run/kf-spire/bootstrap.pem"
    data_dir = "/var/lib/spire/agent"
    log_level = "WARN"
    log_file = "/var/log/kf-spire-agent.log"
}
plugins {
    NodeAttestor "join_token" { plugin_data {} }
    KeyManager "memory" { plugin_data {} }
    WorkloadAttestor "unix" { plugin_data {} }
}

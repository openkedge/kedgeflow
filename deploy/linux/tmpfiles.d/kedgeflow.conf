# Credential directories are administered by root, readable by one role.
d /etc/kedgeflow 0755 root root -
d /etc/kedgeflow/gateway 0750 root kf-gateway -
d /etc/kedgeflow/control 0750 root kf-control -
d /etc/kedgeflow/broker 0750 root kf-broker -
d /etc/kedgeflow/sql-target 0750 root kf-sql-target -
d /etc/kedgeflow/recovery 0750 root kf-recovery -
d /etc/kedgeflow/collector 0750 root kf-collector -
d /etc/kedgeflow/operator 0750 root kf-operator -
d /etc/kedgeflow/governance 0750 root kf-governance -

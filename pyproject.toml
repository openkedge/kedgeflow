[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kedgeflow"
version = "0.1.0a1"
description = "KedgeFlow is an open protocol and reference implementation for separating the control plane from the data plane in AI agent systems."
readme = "README.md"
authors = [
    { name = "The OpenKedge Authors", email = "authors@openkedge.org" },
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
spec = ["cryptography>=43", "jsonschema>=4.23", "PyYAML>=6"]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "fastapi>=0.100.0",
    "httpx>=0.25.0",
    "cryptography>=43",
    "jsonschema>=4.23",
    "PyYAML>=6",
]

[project.scripts]
kedgeflow = "kedgeflow.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kedgeflow"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/whitepaper"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

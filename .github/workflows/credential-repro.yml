name: Credential fixture reproduction

on:
  push:
    branches: ["codex/enterprise-readiness"]
    paths:
      - scripts/qualify-ledger-credentials.py
      - scripts/fetch-ci-credential-artifact.py
      - .github/workflows/credential-repro.yml

permissions:
  contents: read

jobs:
  credential-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch exact retained component without forwarding token to storage
        env:
          KF_CI_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch-ci-credential-artifact.py \
            --run 45008445140 \
            --source cd6f06c31c141e4cd18f85c0670fb4ec08c9b22b \
            --artifact-sha256 6ed0f67fb7f0d50214b5f5e6b425bb423be297fef7b704515c063f90d9279921 \
            --output "$RUNNER_TEMP/credential-component"
      - name: Prepare pinned disposable dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-cryptography
          curl --fail --location --retry 3 https://github.com/etcd-io/etcd/releases/download/v3.6.5/etcd-v3.6.5-linux-amd64.tar.gz -o "$RUNNER_TEMP/etcd.tar.gz"
          printf '%s  %s\n' '66bad39ed920f6fc15fd74adcb8bfd38ba9a6412f8c7852d09eb11670e88cac3' "$RUNNER_TEMP/etcd.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/etcd.tar.gz" -C "$RUNNER_TEMP"
      - name: Reproduce only on the fresh disposable systemd runner
        run: |
          sudo /usr/bin/python3 scripts/qualify-ledger-credentials.py --ephemeral-host \
            --binary "$RUNNER_TEMP/credential-component/kf-ledger-credentials" \
            --etcd "$RUNNER_TEMP/etcd-v3.6.5-linux-amd64/etcd" > credential-component.json
      - name: Reproduce the canonical preceding native and installed lifecycle steps
        run: |
          sudo /usr/bin/python3 scripts/qualify-linux-package.py --ephemeral-host \
            --binary-dir "$RUNNER_TEMP/credential-component/bin" > preceding-native.json
          for split in combined separated; do
            args=()
            if [ "$split" = separated ]; then args+=(--split-control); fi
            sudo /usr/bin/python3 scripts/qualify-systemd-services.py --ephemeral-host --accept-test-install \
              --package "$RUNNER_TEMP/credential-component/native-package.tar.gz" \
              --sha256 "$(sha256sum "$RUNNER_TEMP/credential-component/native-package.tar.gz" | cut -d ' ' -f1)" \
              "${args[@]}" > "preceding-$split.json"
          done
      - name: Repeat credential qualification after canonical lifecycle cleanup
        run: |
          sudo /usr/bin/python3 scripts/qualify-ledger-credentials.py --ephemeral-host \
            --binary "$RUNNER_TEMP/credential-component/kf-ledger-credentials" \
            --etcd "$RUNNER_TEMP/etcd-v3.6.5-linux-amd64/etcd" > credential-after-lifecycle.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bounded-credential-component
          path: |
            credential-component.json
            credential-after-lifecycle.json
            preceding-native.json
            preceding-combined.json
            preceding-separated.json
          if-no-files-found: warn
          retention-days: 7

name: Managed fixture failure inspection

on:
  push:
    branches: ["codex/enterprise-readiness"]
    paths:
      - .github/workflows/managed-diagnostic.yml
      - scripts/inspect-ci-managed-failure.py

permissions:
  contents: read

jobs:
  bounded-failure-category:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inspect exact retained failure without exporting private logs
        env:
          KF_CI_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/inspect-ci-managed-failure.py \
            --run 45069757949 \
            --source 2f85ba148a2b3234fa4185273d5e67e12e8367c3 \
            --artifact-sha256 ab48e8de46c23922453095cb5c1fe66e6a92554e4150f0a42158b0d894d6136f

name: CI

on:
  push:
    branches: [ "main", "codex/enterprise-readiness" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUSTUP_TOOLCHAIN: "1.98.0"
  CARGO_BUILD_JOBS: "2"

jobs:
  msrv:
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Check declared minimum Rust toolchain
      run: |
        rustup toolchain install 1.88.0 --profile minimal
        cargo +1.88.0 check --locked --workspace --all-targets
    - name: Retain qualification provenance
      if: always()
      run: python3 scripts/capture-ci-provenance.py --output ci-provenance.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: provenance-${{ github.job }}-${{ matrix.python-version || 'native' }}
        path: ci-provenance.json
        if-no-files-found: error

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      KF_REQUIRE_SDK: "1"
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "25.2.1"
        cache: npm
        cache-dependency-path: tests/sdk/package-lock.json
    - name: Install pinned SDK and etcd for SQL leaf and failure tests
      run: |
        npm ci --prefix tests/sdk
        curl --fail --location --retry 3 https://github.com/etcd-io/etcd/releases/download/v3.6.5/etcd-v3.6.5-linux-amd64.tar.gz -o /tmp/etcd.tar.gz
        echo "66bad39ed920f6fc15fd74adcb8bfd38ba9a6412f8c7852d09eb11670e88cac3  /tmp/etcd.tar.gz" | sha256sum --check
        tar -xzf /tmp/etcd.tar.gz -C /tmp
    - name: Set up Rust for native SQL target tests
      run: rustup toolchain install 1.98.0 --profile minimal
    - name: Build pinned disposable PostgreSQL test dependency
      run: |
        sudo apt-get update
        sudo apt-get install -y bison flex
        cd "$RUNNER_TEMP"
        curl --fail --location --retry 3 https://ftp.postgresql.org/pub/source/v18.3/postgresql-18.3.tar.bz2 -o postgresql-18.3.tar.bz2
        sha256sum --check <<'HASH'
        d95663fbbf3a80f81a9d98d895266bdcb74ba274bcc04ef6d76630a72dee016f  postgresql-18.3.tar.bz2
        HASH
        tar -xjf postgresql-18.3.tar.bz2
        cd postgresql-18.3
        ./configure --prefix="$RUNNER_TEMP/kf-postgres" --without-icu --without-readline --without-zlib
        make -j2
        make install
    - name: Require peer SQL, custody, fresh SDK and combined failure qualification
      run: |
        ETCD_BINARY=/tmp/etcd-v3.6.5-linux-amd64/etcd python3 scripts/test-postgres.py --bindir "$RUNNER_TEMP/kf-postgres/bin" --peer --recovery-rehearsal \
          --command scripts/start-etcd.sh -- python3 scripts/run-protected-tests.py -- cargo test --locked --test custody --test postgres_peer --test postgres_target --test governance -- --nocapture --test-threads=1 --skip kube_drain_real_
    - name: Require cold physical SQL backup and stale restore refusal
      run: |
        python3 scripts/qualify-postgres-cold-restore.py --ephemeral-host \
          --bindir "$RUNNER_TEMP/kf-postgres/bin" > cold-sql-restore.json
    - name: Prepare separate owned real Kubernetes drain fixture
      run: |
        mkdir -m 700 "$RUNNER_TEMP/kf-drain"
        curl --fail --location --retry 3 https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o "$RUNNER_TEMP/kf-drain/kind"
        (cd "$RUNNER_TEMP/kf-drain" && sha256sum --check <<'HASH'
        aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind
        HASH
        )
        chmod 700 "$RUNNER_TEMP/kf-drain/kind"
        curl --fail --location --retry 3 https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl -o "$RUNNER_TEMP/kf-drain/kubectl"
        (cd "$RUNNER_TEMP/kf-drain" && sha256sum --check <<'HASH'
        6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f  kubectl
        HASH
        )
        chmod 700 "$RUNNER_TEMP/kf-drain/kubectl"
        cat > "$RUNNER_TEMP/kf-drain/kind.yaml" <<'YAML'
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        nodes:
        - role: control-plane
        - role: worker
        - role: worker
        YAML
        "$RUNNER_TEMP/kf-drain/kind" create cluster --name kf8-ci --config "$RUNNER_TEMP/kf-drain/kind.yaml" \
          --kubeconfig "$RUNNER_TEMP/kf-drain/kubeconfig" \
          --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --wait 120s
        python3 scripts/kube-drain-fixture.py --kubectl "$RUNNER_TEMP/kf-drain/kubectl" \
          --kubeconfig "$RUNNER_TEMP/kf-drain/kubeconfig" --cluster kf8-ci --context kind-kf8-ci \
          --namespace kf-drain-0000000000000001 --output "$RUNNER_TEMP/kf-drain/fixture"
    - name: Require isolated real drain, controller process faults and SQL recovery
      run: |
        python3 scripts/kube-drain-rbac.py "$RUNNER_TEMP/kf-drain/fixture" --output kube-drain-rbac.json
        KF_KUBE_FIXTURE="$RUNNER_TEMP/kf-drain/fixture" \
        KF_KUBE_TEST_KUBECTL="$RUNNER_TEMP/kf-drain/kubectl" \
        KF_KUBE_TEST_KUBECONFIG="$RUNNER_TEMP/kf-drain/kubeconfig" \
        KF_KUBE_TEST_CONTEXT=kind-kf8-ci KF_KUBE_TEST_PYTHON="$(command -v python3)" \
        KF_CONFORMANCE_ARTIFACTS="$RUNNER_TEMP/kf-drain/public" \
        ETCD_BINARY=/tmp/etcd-v3.6.5-linux-amd64/etcd \
        python3 scripts/test-postgres.py --bindir "$RUNNER_TEMP/kf-postgres/bin" --peer \
          --command scripts/start-etcd.sh -- python3 scripts/run-protected-tests.py -- python3 scripts/test-kube-drain.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: kube-drain-public
        path: |
          ${{ runner.temp }}/kf-drain/public
          cold-sql-restore.json
    - name: Remove only the owned Kubernetes test cluster
      if: always()
      run: |
        if [ -x "$RUNNER_TEMP/kf-drain/kind" ]; then
          "$RUNNER_TEMP/kf-drain/kind" delete cluster --name kf8-ci --kubeconfig "$RUNNER_TEMP/kf-drain/kubeconfig"
        fi
    - name: Retain qualification provenance
      if: always()
      run: python3 scripts/capture-ci-provenance.py --output ci-provenance.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: provenance-${{ github.job }}-${{ matrix.python-version || 'native' }}
        path: ci-provenance.json
        if-no-files-found: error

  postgres-isolation:
    # Account isolation must run even when the separate Kubernetes job fails.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Build the pinned disposable Linux fixture
      run: |
        mkdir postgres-isolation-evidence
        git rev-parse HEAD > postgres-isolation-evidence/revision.txt
        docker build -f scripts/postgres-isolation.Dockerfile \
          --iidfile postgres-isolation-evidence/image-id.txt \
          -t kf-postgres-isolation:ci . 2>&1 | tee postgres-isolation-evidence/build.log
        docker image inspect kf-postgres-isolation:ci > postgres-isolation-evidence/image.json
    - name: Require separate accounts and live authenticated target probes
      run: |
        docker run --name kf-postgres-isolation --network none \
          --pids-limit 256 --memory 1g kf-postgres-isolation:ci \
          > postgres-isolation-evidence/report.json 2> postgres-isolation-evidence/fixture.log
    - name: Retain material pins and clean up the exact fixture container
      if: always()
      run: |
        if docker container inspect kf-postgres-isolation > /dev/null 2>&1; then
          trap 'docker rm -f kf-postgres-isolation' EXIT
          docker inspect kf-postgres-isolation > postgres-isolation-evidence/container.json
          docker cp kf-postgres-isolation:/opt/kf/source-sha256.txt postgres-isolation-evidence/
          docker cp kf-postgres-isolation:/opt/kf/source.tar.gz postgres-isolation-evidence/
          docker cp kf-postgres-isolation:/opt/kf/packages.txt postgres-isolation-evidence/
          docker cp kf-postgres-isolation:/opt/kf/tools.txt postgres-isolation-evidence/
        fi
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: postgres-isolation
        path: postgres-isolation-evidence
    - name: Retain qualification provenance
      if: always()
      run: python3 scripts/capture-ci-provenance.py --output ci-provenance.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: provenance-${{ github.job }}-${{ matrix.python-version || 'native' }}
        path: ci-provenance.json
        if-no-files-found: error

  selfhosted-identity:
    runs-on: ubuntu-24.04
    needs: rust
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.13"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "25.2.1"
        cache: npm
        cache-dependency-path: tests/sdk/package-lock.json
    - name: Prepare the explicit native pilot checker
      run: |
        pip install -c requirements-ci.txt -e ".[dev]"
        rustup toolchain install 1.98.0 --profile minimal
        rustup default 1.98.0
        cargo +1.98.0 build --locked --bin kf-pilot-identities
        cargo +1.98.0 test --locked --features selfhosted-pilot-tests --test governance --no-run
        cargo +1.98.0 test --locked --features selfhosted-pilot-tests --test broker_service --no-run
        npm ci --prefix tests/sdk
        curl --fail --location --retry 3 https://github.com/etcd-io/etcd/releases/download/v3.6.5/etcd-v3.6.5-linux-amd64.tar.gz -o /tmp/etcd.tar.gz
        echo "66bad39ed920f6fc15fd74adcb8bfd38ba9a6412f8c7852d09eb11670e88cac3  /tmp/etcd.tar.gz" | sha256sum --check
        tar -xzf /tmp/etcd.tar.gz -C /tmp
    - name: Build pinned disposable PostgreSQL
      run: |
        sudo apt-get update
        sudo apt-get install -y bison flex libatomic1
        cd "$RUNNER_TEMP"
        curl --fail --location --retry 3 https://ftp.postgresql.org/pub/source/v18.3/postgresql-18.3.tar.bz2 -o postgresql-18.3.tar.bz2
        sha256sum --check <<'HASH'
        d95663fbbf3a80f81a9d98d895266bdcb74ba274bcc04ef6d76630a72dee016f  postgresql-18.3.tar.bz2
        HASH
        tar -xjf postgresql-18.3.tar.bz2
        cd postgresql-18.3
        ./configure --prefix="$RUNNER_TEMP/kf-postgres" --without-icu --without-readline --without-zlib
        make -j2
        make install
    - name: Build the pinned SPIRE workload fixture
      run: |
        docker pull quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
        docker build --build-arg TARGETARCH=amd64 -t kf-selfhosted-workload:20261030 \
          pilots/self-hosted
    - name: Require actual provider issuance and native verification
      run: |
        python scripts/run-protected-tests.py -- python scripts/selfhosted-pilot.py --docker "$(command -v docker)" \
          --docker-host unix:///var/run/docker.sock \
          --checker "$PWD/target/debug/kf-pilot-identities" \
          --output selfhosted-identity-evidence
    - name: Require fresh shipping SQL and official SDK recovery with actual providers
      run: |
        ETCD_BINARY=/tmp/etcd-v3.6.5-linux-amd64/etcd \
          python scripts/run-protected-tests.py -- python scripts/selfhosted-pilot.py --docker "$(command -v docker)" \
          --docker-host unix:///var/run/docker.sock --managed-sql-workflow \
          --postgres-bindir "$RUNNER_TEMP/kf-postgres/bin" \
          --output selfhosted-sql-evidence
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: linux-core-runtime
        path: ${{ runner.temp }}/kf-managed-release
    - name: Prepare exact release and compiled test harness for the systemd provider workflow
      run: |
        cargo +1.98.0 test --locked --features selfhosted-pilot-tests --test governance --no-run --message-format=json > "$RUNNER_TEMP/kf-managed-test.jsonl"
        python3 - <<'PY'
        import hashlib, json, os, pathlib
        temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
        packages = list((temporary / "kf-managed-release").rglob("*.tar.gz"))
        assert len(packages) == 1
        records = [json.loads(line) for line in (temporary / "kf-managed-test.jsonl").read_text().splitlines() if line.startswith("{")]
        binaries = [r["executable"] for r in records if r.get("reason") == "compiler-artifact" and r.get("target", {}).get("name") == "governance" and r.get("executable")]
        assert len(binaries) == 1
        values = {"KF_SYSTEMD_PILOT_PACKAGE": str(packages[0].resolve()),
                  "KF_SYSTEMD_PILOT_SHA256": hashlib.sha256(packages[0].read_bytes()).hexdigest(),
                  "KF_SYSTEMD_PILOT_TEST_BINARY": binaries[0],
                  "KF_SYSTEMD_PILOT_EPHEMERAL_HOST": "1",
                  "ETCD_BINARY": "/tmp/etcd-v3.6.5-linux-amd64/etcd"}
        with open(os.environ["GITHUB_ENV"], "a") as stream:
            for name, value in values.items(): stream.write(name + "=" + value + "\n")
        PY
    - name: Require managed providers to separate systemd roles and SDK agent
      run: |
        python scripts/run-protected-tests.py -- python scripts/selfhosted-pilot.py --docker "$(command -v docker)" \
          --docker-host unix:///var/run/docker.sock --managed-sql-workflow \
          --sql-runner scripts/systemd-sql-workflow.py \
          --postgres-bindir "$RUNNER_TEMP/kf-postgres/bin" \
          --output selfhosted-systemd-evidence
    - name: Require actual issuer rollover and shipping broker withdrawal/restore refusal
      run: |
        ETCD_BINARY=/tmp/etcd-v3.6.5-linux-amd64/etcd \
          python scripts/run-protected-tests.py -- python scripts/selfhosted-pilot.py --docker "$(command -v docker)" \
          --docker-host unix:///var/run/docker.sock --identity-lifecycle \
          --output selfhosted-lifecycle-evidence
    - name: Require cold provider storage restore and stale issuer refusal
      run: |
        ETCD_BINARY=/tmp/etcd-v3.6.5-linux-amd64/etcd \
          python scripts/run-protected-tests.py -- python scripts/selfhosted-pilot.py --docker "$(command -v docker)" \
          --docker-host unix:///var/run/docker.sock --identity-storage-restore \
          --output selfhosted-storage-evidence
    - name: Require SPIRE JWT and X.509 issuer rollover
      run: |
        ETCD_BINARY=/tmp/etcd-v3.6.5-linux-amd64/etcd \
          python scripts/run-protected-tests.py -- python scripts/selfhosted-pilot.py --docker "$(command -v docker)" \
          --docker-host unix:///var/run/docker.sock --spire-issuer-rollover \
          --output selfhosted-spire-evidence
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: selfhosted-identity
        path: selfhosted-identity-evidence
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: selfhosted-sql
        path: selfhosted-sql-evidence
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: selfhosted-systemd
        path: selfhosted-systemd-evidence
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: selfhosted-lifecycle
        path: selfhosted-lifecycle-evidence
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: selfhosted-storage
        path: selfhosted-storage-evidence
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: selfhosted-spire
        path: selfhosted-spire-evidence
    - name: Retain qualification provenance
      if: always()
      run: python3 scripts/capture-ci-provenance.py --output ci-provenance.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: provenance-${{ github.job }}-${{ matrix.python-version || 'native' }}
        path: ci-provenance.json
        if-no-files-found: error

  linux-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.11"
    - name: Verify staged units, system accounts and kernel file boundaries
      run: |
        sudo python3 scripts/qualify-linux-package.py --ephemeral-host > linux-package-staged.json 2> linux-package-staged.stderr
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: linux-package-staged
        path: |
          linux-package-staged.json
          linux-package-staged.stderr
    - name: Retain qualification provenance
      if: always()
      run: python3 scripts/capture-ci-provenance.py --output ci-provenance.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: provenance-${{ github.job }}-${{ matrix.python-version || 'native' }}
        path: ci-provenance.json
        if-no-files-found: error

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      KF_REQUIRE_SDK: "1"
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "25.2.1"
        cache: npm
        cache-dependency-path: tests/sdk/package-lock.json
    - name: Set up Rust
      run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
    - name: Install pinned SDK and etcd test dependency
      run: |
        npm ci --prefix tests/sdk
        curl --fail --location --retry 3 https://github.com/etcd-io/etcd/releases/download/v3.6.5/etcd-v3.6.5-linux-amd64.tar.gz -o /tmp/etcd.tar.gz
        echo "66bad39ed920f6fc15fd74adcb8bfd38ba9a6412f8c7852d09eb11670e88cac3  /tmp/etcd.tar.gz" | sha256sum --check
        tar -xzf /tmp/etcd.tar.gz -C /tmp
    - name: Verify agent and lease client vectors
      run: |
        node tests/sdk/agent-vectors.mjs
        node tests/sdk/keycloak-vectors.mjs
        node tests/sdk/managed-drain-vectors.mjs
        node tests/sdk/terraform-vectors.mjs
        node tests/sdk/terraform-pair-vectors.mjs
        node tests/sdk/lease-vectors.mjs
        node tests/sdk/family-saga-vectors.mjs
    - name: Verify deployment acceptance records and refusals
      run: node --test tests/test_terraform_acceptance.mjs tests/test_pilot_acceptance.mjs tests/test_release_ci.mjs
    - name: Format and lint
      run: |
        mkdir -p ci-evidence
        rustc --version --verbose > ci-evidence/rust-toolchain.txt
        cargo fmt --all -- --check 2>&1 | tee ci-evidence/rustfmt.log
        cargo clippy --locked --workspace --all-targets --features selfhosted-pilot-tests -- -D warnings 2>&1 | tee ci-evidence/clippy.log
    - name: Required real-cluster and SDK integration tests
      run: |
        ETCD_BINARY=/tmp/etcd-v3.6.5-linux-amd64/etcd scripts/start-etcd.sh -- python3 scripts/run-protected-tests.py -- cargo test --locked --workspace --all-targets -- --nocapture --test-threads=1 --skip kube_drain_real_
    - name: Package and verify managed Linux core executables
      run: |
        SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python3 scripts/package-linux.py --output dist/linux
        for package in dist/linux/*.tar.gz; do
          python3 scripts/verify-linux-package.py "$package"
        done
    - name: Require native release preflight under separate kernel UIDs
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-cryptography
        sudo /usr/bin/python3 scripts/qualify-linux-package.py --ephemeral-host \
          --binary-dir "$PWD/target/release" > linux-native-preflight.json
    - name: Require disposable installed systemd lifecycle and sandbox smoke
      run: |
        python3 - <<'PY'
        import hashlib, pathlib, subprocess
        packages = list(pathlib.Path("dist/linux").glob("*.tar.gz"))
        assert len(packages) == 1
        package = packages[0].resolve()
        digest = hashlib.sha256(package.read_bytes()).hexdigest()
        with open("linux-systemd-smoke.json", "w") as log:
            subprocess.run([
                "sudo", "/usr/bin/python3", "scripts/qualify-systemd-services.py",
                "--ephemeral-host", "--accept-test-install",
                "--package", str(package), "--sha256", digest,
            ], stdout=log, check=True)
        PY
    - name: Require protected ledger credential renewal under systemd
      run: |
        sudo /usr/bin/python3 scripts/qualify-ledger-credentials.py --ephemeral-host \
          --binary "$PWD/target/release/kf-ledger-credentials" \
          --etcd /tmp/etcd-v3.6.5-linux-amd64/etcd > linux-ledger-credentials.json
    - name: Build pinned PostgreSQL for the live systemd SQL component
      run: |
        sudo apt-get install -y bison flex
        curl --fail --location --retry 3 https://ftp.postgresql.org/pub/source/v18.3/postgresql-18.3.tar.bz2 -o "$RUNNER_TEMP/systemd-postgresql.tar.bz2"
        python3 - <<'PY'
        import hashlib, os, pathlib
        path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "systemd-postgresql.tar.bz2"
        assert hashlib.sha256(path.read_bytes()).hexdigest() == "d95663fbbf3a80f81a9d98d895266bdcb74ba274bcc04ef6d76630a72dee016f"
        PY
        tar -xjf "$RUNNER_TEMP/systemd-postgresql.tar.bz2" -C "$RUNNER_TEMP"
        cd "$RUNNER_TEMP/postgresql-18.3"
        ./configure --prefix="$RUNNER_TEMP/kf-systemd-postgres" --without-icu --without-readline --without-zlib
        make -j2
        make install
    - name: Require exact-release live SQL COMMIT and query recovery under systemd
      run: |
        python3 - <<'PY'
        import hashlib, os, pathlib, subprocess
        packages = list(pathlib.Path("dist/linux").glob("*.tar.gz"))
        assert len(packages) == 1
        package = packages[0].resolve()
        with open("linux-systemd-sql.json", "w") as log, open("linux-systemd-sql.stderr", "w") as errors:
            subprocess.run([
                "sudo", "/usr/bin/python3", "scripts/qualify-systemd-sql.py", "--ephemeral-host",
                "--package", str(package), "--sha256", hashlib.sha256(package.read_bytes()).hexdigest(),
                "--bindir", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "kf-systemd-postgres/bin"),
            ], stdout=log, stderr=errors, check=True)
        PY
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: linux-core-runtime
        path: |
          ci-evidence
          dist/linux
          linux-native-preflight.json
          linux-systemd-smoke.json
          linux-ledger-credentials.json
          linux-systemd-sql.json
          linux-systemd-sql.stderr
        if-no-files-found: error
    - name: Retain qualification provenance
      if: always()
      run: python3 scripts/capture-ci-provenance.py --output ci-provenance.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: provenance-${{ github.job }}-${{ matrix.python-version || 'native' }}
        path: ci-provenance.json
        if-no-files-found: error

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install pip==26.0
        pip install -c requirements-ci.txt -e ".[dev]"

    - name: Verify frozen paper and protocol contracts
      run: python scripts/verify-whitepaper.py

    - name: Run linter (ruff)
      run: |
        ruff check .

    - name: Run type checking (mypy)
      run: |
        mypy src

    - name: Validate pilot infrastructure
      run: |
        pip install -c requirements-ci.txt cfn-lint==1.39.1
        cfn-lint deploy/pilot/cura/infrastructure-v1.json
    - name: Run tests (pytest)
      run: |
        pytest -v --junitxml=pytest-results.xml
        python scripts/verify-test-results.py pytest-results.xml

    - name: Run demo scripts
      run: |
        python examples/hello_kedgeflow.py
        python examples/conflicting_agents.py
        kedgeflow --version
        kedgeflow status
        kedgeflow demo
        kedgeflow demo conflict
    - name: Retain qualification provenance
      if: always()
      run: python3 scripts/capture-ci-provenance.py --output ci-provenance.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: provenance-${{ github.job }}-${{ matrix.python-version || 'native' }}
        path: ci-provenance.json
        if-no-files-found: error

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.13"
    - name: Audit locked dependency advisories
      run: |
        pip install certifi==2026.10.19
        python scripts/audit-dependencies.py --output dependency-audit
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: dependency-audit
        path: dependency-audit
        if-no-files-found: error

  release-required:
    # Configure this stable check name in branch protection. A skipped prerequisite
    # must fail this job; GitHub otherwise treats some skipped checks as satisfied.
    if: always()
    needs: [msrv, rust, postgres, postgres-isolation, linux-package, selfhosted-identity, test, dependency-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require every qualification job
      env:
        REQUIRED_RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json, os
        results = json.loads(os.environ["REQUIRED_RESULTS"])
        failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
        if failed:
            raise SystemExit("Required qualification did not pass: " + json.dumps(failed, sort_keys=True))
        print("All required qualification jobs passed on this source revision")
        PY

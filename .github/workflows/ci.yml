name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  postgres:
    runs-on: ubuntu-latest
    env:
      KF_REQUIRE_SDK: "1"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "25"
        cache: npm
        cache-dependency-path: tests/sdk/package-lock.json
    - name: Install pinned SDK and etcd for SQL leaf and failure tests
      run: |
        npm ci --prefix tests/sdk
        curl --fail --location --retry 3 https://github.com/etcd-io/etcd/releases/download/v3.6.5/etcd-v3.6.5-linux-amd64.tar.gz -o /tmp/etcd.tar.gz
        tar -xzf /tmp/etcd.tar.gz -C /tmp
    - name: Set up Rust for native SQL target tests
      run: rustup toolchain install stable --profile minimal
    - name: Build pinned disposable PostgreSQL test dependency
      run: |
        sudo apt-get update
        sudo apt-get install -y bison flex
        cd "$RUNNER_TEMP"
        curl --fail --location --retry 3 https://ftp.postgresql.org/pub/source/v18.3/postgresql-18.3.tar.bz2 -o postgresql-18.3.tar.bz2
        sha256sum --check <<'HASH'
        d95663fbbf3a80f81a9d98d895266bdcb74ba274bcc04ef6d76630a72dee016f  postgresql-18.3.tar.bz2
        HASH
        tar -xjf postgresql-18.3.tar.bz2
        cd postgresql-18.3
        ./configure --prefix="$RUNNER_TEMP/kf-postgres" --without-icu --without-readline --without-zlib
        make -j2
        make install
    - name: Require SQL target, fresh SDK path and combined failure qualification
      run: |
        ETCD_BINARY=/tmp/etcd-v3.6.5-linux-amd64/etcd python3 scripts/test-postgres.py --bindir "$RUNNER_TEMP/kf-postgres/bin" \
          --command scripts/start-etcd.sh -- cargo test --locked --test postgres_target --test governance -- --nocapture --test-threads=1
  rust:
    runs-on: ubuntu-latest
    env:
      KF_REQUIRE_SDK: "1"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "25"
        cache: npm
        cache-dependency-path: tests/sdk/package-lock.json
    - name: Set up Rust
      run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
    - name: Install pinned SDK and etcd test dependency
      run: |
        npm ci --prefix tests/sdk
        curl --fail --location --retry 3 https://github.com/etcd-io/etcd/releases/download/v3.6.5/etcd-v3.6.5-linux-amd64.tar.gz -o /tmp/etcd.tar.gz
        tar -xzf /tmp/etcd.tar.gz -C /tmp
    - name: Format and lint
      run: |
        cargo fmt --all -- --check
        cargo clippy --locked --workspace --all-targets -- -D warnings
    - name: Required real-cluster and SDK integration tests
      run: |
        ETCD_BINARY=/tmp/etcd-v3.6.5-linux-amd64/etcd scripts/start-etcd.sh -- cargo test --locked --workspace --all-targets -- --nocapture
    - name: Build executable
      run: cargo build --locked --release --bin kf-proxy
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Verify frozen paper and protocol contracts
      run: python scripts/verify-whitepaper.py

    - name: Run linter (ruff)
      run: |
        ruff check .

    - name: Run type checking (mypy)
      run: |
        mypy src

    - name: Run tests (pytest)
      run: |
        pytest -v

    - name: Run demo scripts
      run: |
        python examples/hello_kedgeflow.py
        python examples/conflicting_agents.py
        kedgeflow --version
        kedgeflow status
        kedgeflow demo
        kedgeflow demo conflict
